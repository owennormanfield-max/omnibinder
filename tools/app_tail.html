tional Championships','city-championships':'City Championships','state-championships':'State Championships','gym-challenge':'Gym Challenge','stadium-challenge':'Stadium Challenge','international-championship-europe':'Europe International Championships','international-championship-latin-america':'Latin America International Championships','international-championship-north-america':'North America International Championships','worlds-2004':'World Championships 2004','worlds-2005':'World Championships 2005','worlds-2007':'World Championships 2007','worlds-2008':'World Championships 2008','worlds-2009':'World Championships 2009','worlds-2010':'World Championships 2010','worlds-2022':'World Championships 2022','worlds-2023':'World Championships 2023','worlds-2024':'World Championships 2024','worlds-2025':'World Championships 2025','1st-movie':'1st Movie','1st-movie-inverted':'1st Movie (Inverted)','pokemon-4-ever':'Pokémon 4Ever','destiny-deoxys':'Destiny Deoxys','poketour-99':'PokéTour 1999','pokemon-rocks-america':'Pokémon Rocks America','kraze-club':'Kraze Club','scrye':'Scrye','inquest-gamer':'InQuest Gamer','wizard-world-chicago':'Wizard World Chicago','wizard-world-philadelphia':'Wizard World Philadelphia','nintendo-world':'Nintendo World','games-expo':'Games Expo','pop-tournament':'POP Tournament','grey-star':'Grey Star','d-edition-error':'D Edition Error','1st-edition-error':'1st Edition Error','1st-edition-scratch-error':'1st Edition Scratch Error','chicago-2009':'Chicago 2009','tournament-collection':'Tournament Collection',
 'unlimited':'Unlimited','shadowless':'Shadowless','shadowless-red-cheek':'Shadowless (Red Cheeks)','1999-2000-copyright':'1999–2000 Copyright','1999-copyright':'1999 Copyright','1995-1998-copyright':'1995–1998 Copyright','2019-copyright':'2019 Copyright','2020-copyright':'2020 Copyright','no-rarity':'No Rarity','no-e-reader':'No e-Reader Logo','missing-expansion-symbol':'Missing Expansion Symbol','blue-border':'Blue Border','gold-border':'Gold Border','glossy':'Glossy','japanese-back':'Japanese Back','peelable-ditto':'Peelable Ditto','cosmos':'Cosmos Holo','aoki-error':'Aoki Error','no-holo-error':'No Holo Error','phanphy-error':'Phanpy Error','rarity-error':'Rarity Error','d-ink-dot-error':'D Ink Dot Error','missing-hp':'Missing HP','evolution-box-error':'Evolution Box Error','text-error':'Text Error','energy-symbol-error':'Energy Symbol Error','shifted-energy-cost':'Shifted Energy Cost','missing-retreat-cost':'Missing Retreat Cost','nintedo-error':'Nintedo Error',
 'pokeball-foil':'Poké Ball Holo','greatball':'Great Ball Holo','ultraball':'Ultra Ball Holo','masterball':'Master Ball Holo','gold':'Gold Holo','galaxy':'Galaxy Holo','starlight':'Starlight Holo','energy':'Energy Holo','cracked-ice':'Cracked Ice Holo','mirror':'Mirror Holo','league':'League Holo','player-reward':'Player Rewards Holo','tinsel':'Tinsel Holo','loveball':'Love Ball Holo','friendball':'Friend Ball Holo','quickball':'Quick Ball Holo','team-rocket':'Team Rocket Holo','duskball':'Dusk Ball Holo','rainbow':'Rainbow Holo','glitter':'Glitter Holo'};
const titleCase=s=>s.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const proper=k=>PROPER[k]||titleCase(k);
const foilName=k=>k==='pokeball'?'Poké Ball Holo':k==='cosmos'?'Cosmos Holo':(PROPER[k]||titleCase(k)+' Holo');
function vkey(v){return [VT[v[0]],v[1]>=0?VST[v[1]]:'',v[2].map(x=>VSTAMP[x]).join('+'),v[3]>=0?VFOIL[v[3]]:'',v[4]?'jumbo':''].join('|');}
function vlabel(v){const fin=VT[v[0]];const parts=[];v[2].forEach(x=>parts.push(proper(VSTAMP[x])));if(v[1]>=0)parts.push(proper(VST[v[1]]));if(v[3]>=0)parts.push(foilName(VFOIL[v[3]]));if(fin!=='normal'||!parts.length)parts.unshift(FIN[fin]||titleCase(fin));if(v[4])parts.push('Jumbo');return parts.join(' · ');}
const STAMPGLYPH=[['1st-edition','1st','1st Edition'],['pre-release','PRE','Prerelease'],['staff','STAFF','Staff'],['set-logo','◈','Set stamp'],['w-promo','W','W promo'],['winner','★','Winner'],['snowflake','❄','Holiday calendar'],['countdown-calendar','❄','Countdown calendar'],['trick-or-trade','🎃','Trick or Trade'],['pokemon-center','◉','Pokémon Center'],['player-rewards-program','PR','Player Rewards'],['professor-program','Prof','Professor Program'],['worlds-','🏆','Worlds'],['international-championship','🏆','Internationals'],['regional-championships','🏅','Regionals'],['national-championships','🏅','Nationals'],['city-championships','🏅','City Champs'],['state-championships','🏅','State Champs'],['gym-challenge','🏅','Gym Challenge'],['stadium-challenge','🏅','Stadium Challenge'],['25th-celebration','25','25th'],['30th-anniversary','30','30th'],['10th-anniversary','10','10th'],['judge','⚖','Judge'],['ace-trainer','ACE','Ace Trainer'],['champion','👑','Champion'],['finalist','2','Finalist'],['mcdonalds','M','McDonald\'s'],['gamestop','GS','GameStop'],['eb-games','EB','EB Games'],['toys-r-us','TRU','Toys R Us'],['comic-con','CC','Comic-Con'],['gen-con','GC','Gen Con'],['origins','OR','Origins'],['pokemon-day','PD','Pokémon Day'],['illustration-contest','🎨','Illustration Contest'],['-ball-league','⚪','League'],['asia-promo','ASIA','Asia promo'],['rain-city','NBA','Rain City'],['fossil-museum','🦴','Fossil Museum'],['horizons','HZ','Horizons'],['pokemon-together','PT','Together'],['thank-you','TY','Thank you'],['jr-stamp-rally','JR','Stamp Rally'],['wotc','W','WotC'],['pikachu','⚡','Pikachu stamp'],['bulbasaur','🌱','Bulbasaur'],['charmander','🔥','Charmander'],['squirtle','💧','Squirtle'],['pokeball','◓','Poké Ball'],['distributor-meeting','DM','Distributor'],['platinum','Pt','Platinum']];
function stampInfo(s){for(const [k,g,l] of STAMPGLYPH)if(s.includes(k))return {g,l};if(/^[a-z]+-[a-z-]+$/.test(s)&&!/\d/.test(s))return {g:'✍',l:hum(s)};return {g:'◈',l:hum(s)};}
function vshort(v){return vlabel(v);}
function vicon(v){const fin=VT[v[0]];if(v[2].length)return '◈';if(fin==='reverse')return 'R<sup>+</sup>';if(fin==='holo')return '✦';if(fin==='metal')return '▣';if(fin==='lenticular')return '◐';return 'N';}
function stampBadge(v){if(!v[2].length)return '';const s=VSTAMP[v[2][0]];const {g,l}=stampInfo(s);return `<span class="stamp" title="${esc(l)}">${esc(g)}</span>`;}
CARDS.forEach(c=>{c.vs=c[11].map(v=>norm(vlabel(v)+' '+vshort(v)+' '+v[2].map(x=>VSTAMP[x]).join(' ')));});

const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

// ---------- filter state ----------
const F=Object.assign({unit:'print',lang:'en',cols:3,split:'set',sort:'new',state:'all',vars:[],type:[],reg:[],rar:[],notes:'all',cat:[],stage:[],set:[],ser:[],hpmin:'',hpmax:'',yearmin:'',yearmax:'',ill:[],img:true,noen:'all'},LS('omni.filters')||{});
if(!LANGSET.has(F.lang))F.lang='en';

// ---------- collection (owned/notes) ----------
let COLL=LS('omni.coll')||{}; // cardId -> {o:{vkey:1}, n:note}

function savedText(){const t=LS('omni.saved');return t?'Saved in this browser · last change '+new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Saved in this browser';}
const BYSID=new Map();CARDS.forEach(c=>BYSID.set(c.sid,c));
function normEntry(e){
  if(!e)return null;
  if(typeof e.o==='number'){const m=e.o;const o={};const c=BYSID.get(e.sid);if(c&&m){c[11].forEach(v=>{const t=VT[v[0]];if((m&1&&t==='normal')||(m&2&&t==='holo')||(m&4&&t==='reverse')||(m&8&&t==='metal')||(m&16&&t==='lenticular'))o[vkey(v)]=1;});}return {o,n:e.n||''};}
  return {o:e.o&&typeof e.o==='object'?e.o:{},n:e.n||''};
}
for(const [id,e] of Object.entries(COLL)){if(e)e.sid=id;COLL[id]=normEntry(e);}
const ownedCount=e=>e&&e.o?Object.keys(e.o).length:0;
function setEntry(id,o,n){
  o=o||{};n=(n||'').trim();
  if(!Object.keys(o).length&&!n){delete COLL[id];saveLocal();dbColl&&dbColl.doc(id).delete().catch(()=>{});}
  else{COLL[id]={o,n};saveLocal();dbColl&&dbColl.doc(id).set({o,n}).catch(()=>{});}
  updateOwnPill();
}
function updateOwnPill(){let n=0;for(const e of Object.values(COLL))n+=ownedCount(e);$('#ownpill').textContent=n.toLocaleString()+' owned';}
const pOwned=p=>{const c=CARDS[P_C[p]],e=COLL[c.sid];return !!(e&&e.o&&e.o[vkey(c[11][P_V[p]])]);};
const cOwned=c=>ownedCount(COLL[c.sid])>0;
updateOwnPill();
(async()=>{
  try{
    const db=await claude.use('db');const user=await claude.use('user');
    if(!db||!user)return;
    const uid=await user.id();dbColl=db.collection('data/users/'+uid+'/binder/prints');
    const snap=await dbColl.get();
    let changed=false;
    snap.docs.forEach(d=>{const v=d.data();if(v){v.sid=d.id;COLL[d.id]=normEntry(v);changed=true;}});
    // push anything that only lived in this browser
    for(const [id,e] of Object.entries(COLL)){if(!snap.docs.some(d=>d.id===id))dbColl.doc(id).set({o:e.o,n:e.n||''}).catch(()=>{});}
    if(changed){saveLocal();updateOwnPill();render();}
  }catch(e){}
})();

// ---------- collection folders ----------
// FOLDERS: id -> {n:name, p:parentId|'' , c:[printKey...], t:created}
let FOLDERS=LS('omni.folders')||{};
let dbFold=null;let VIEW='binder',CUR='',PICK=null;

const PK=new Map();for(let p=0;p<NP;p++)PK.set(pkeyOf(p),p);
function putFolder(id,f){FOLDERS[id]=f;saveFolders();dbFold&&dbFold.doc(id).set({n:f.n,p:f.p,c:f.c,t:f.t}).catch(()=>{});updateCollCount();}
function dropFolder(id){for(const k in FOLDERS)if(FOLDERS[k].p===id)dropFolder(k);delete FOLDERS[id];saveFolders();dbFold&&dbFold.doc(id).delete().catch(()=>{});updateCollCount();}
const kids=id=>Object.entries(FOLDERS).filter(([k,f])=>f.p===id).sort((a,b)=>a[1].n.localeCompare(b[1].n)).map(([k])=>k);
function countDeep(id){const f=FOLDERS[id];let n=f?f.c.length:0;for(const k of kids(id))n+=countDeep(k);return n;}
function pathOf(id){const out=[];while(id&&FOLDERS[id]){out.unshift(id);id=FOLDERS[id].p;}return out;}
const inFolders=pk=>Object.entries(FOLDERS).filter(([k,f])=>f.c.includes(pk)).map(([k])=>k);
function updateCollCount(){const all=new Set();for(const f of Object.values(FOLDERS))f.c.forEach(x=>all.add(x));$('#collcount').textContent=all.size?all.size.toLocaleString():'';}
updateCollCount();
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1400);}
(async()=>{
  try{
    const db=await claude.use('db');const user=await claude.use('user');
    if(!db||!user)return;
    const uid=await user.id();dbFold=db.collection('data/users/'+uid+'/binder/folders');
    const snap=await dbFold.get();let changed=false;
    snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.n==='string'){FOLDERS[d.id]={n:v.n,p:v.p||'',c:Array.isArray(v.c)?v.c:[],t:v.t||0};changed=true;}});
    for(const [id,f] of Object.entries(FOLDERS)){if(!snap.docs.some(d=>d.id===id))dbFold.doc(id).set({n:f.n,p:f.p,c:f.c,t:f.t}).catch(()=>{});}
    if(changed){saveFolders();updateCollCount();if(VIEW==='coll')renderColl();}
  }catch(e){}
})();

// ---------- helpers ----------
const L=()=>F.lang;

const sdate=s=>typeof s.d==='string'?s.d:(s.d?(s.d[L()]||Object.values(s.d).sort()[0]||''):'');
const sdateAny=s=>typeof s.d==='string'?s.d:(s.d?Object.values(s.d).sort()[0]||'':'');

function matchPhoto(r){
  const nameKeys=[r.name,r.nameEnglish].filter(Boolean).map(norm).filter(Boolean);
  const num=r.number?String(r.number).trim().toUpperCase().replace(/^0+(?=\d)/,''):'';
  const total=r.total?+r.total:0;const code=r.setCode?norm(r.setCode):'';
  const scored=[];
  for(const c of CARDS){
    let sc=0;const cn=c[1].toUpperCase().replace(/^0+(?=\d)/,'');
    const names=Object.values(c[2]).map(norm);
    const nameHit=nameKeys.some(k=>names.some(n=>n===k))?3:nameKeys.some(k=>names.some(n=>n.includes(k)||k.includes(n)))?1.5:0;
    if(!nameHit&&!num)continue;
    if(num&&cn===num)sc+=3;else if(num&&nameHit===0)continue;
    sc+=nameHit;
    const s=SETS[c[0]];
    if(total&&s.c===total)sc+=2.5;
    if(code&&(norm(s.a||'')===code||norm(s.i)===code))sc+=2;
    if(r.hp&&c[5]===+r.hp)sc+=1;
    if(r.regulationMark&&c[8]===String(r.regulationMark).toUpperCase())sc+=1;
    if(r.language&&c[2][r.language])sc+=.5;
    if(sc>=3)scored.push([sc,c.i]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  const best=scored.length?scored[0][0]:0;
  return scored.filter(x=>x[0]>=Math.max(3,best-3)).slice(0,60).map(x=>x[1]);
}
function shrink(file,max){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>res(b||file),'image/jpeg',.88);};img.onerror=()=>res(file);img.src=URL.createObjectURL(file);});}

  if(err){try{history.replaceState(null,'',location.pathname);}catch(e){}setTimeout(()=>{openSheet(`<h3>Sign-in link didn't work</h3><p class="hint">${esc(decodeURIComponent(err[1].replace(/\+/g,' ')))}. Links are single-use and expire after an hour — tap Sign in to get a fresh one.</p><div class="row"><button class="btn pri" id="ok2">OK</button></div>`);$('#ok2').onclick=closeSheet;},600);}
  const m=location.hash.match(/access_token=([^&]+)/);
  if(m){const q=new URLSearchParams(location.hash.slice(1));const s={access_token:q.get('access_token'),refresh_token:q.get('refresh_token'),expires_at:Date.now()+(+q.get('expires_in')||3600)*1000};
    try{history.replaceState(null,'',location.pathname);}catch(e){}
    try{const u=await (await fetch(SB_URL+'/auth/v1/user',{headers:{apikey:SB_KEY,Authorization:'Bearer '+s.access_token}})).json();s.user={id:u.id,email:u.email};setSession(s);toast('Signed in as '+u.email);}catch(e){}
  }
  if(SESSION)await cloudPull();
  renderAcct();
})();
async function refreshSession(){if(!SESSION||!SESSION.refresh_token)return false;try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SESSION.refresh_token})});if(!r.ok)throw 0;const j=await r.json();setSession({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,user:SESSION.user||{id:j.user?.id,email:j.user?.email}});return true;}catch(e){return false;}}
async function ensureFresh(){if(!SESSION)return false;if(Date.now()>SESSION.expires_at-60000)return refreshSession();return true;}
function mergeInto(coll,folders){
  let changed=false;
  for(const [id,e] of Object.entries(coll||{})){const ne=normEntry(Object.assign({sid:id},e));if(!ne)continue;const cur=COLL[id];if(!cur){COLL[id]=ne;changed=true;continue;}const o=Object.assign({},cur.o,ne.o);const n=cur.n||ne.n;if(JSON.stringify(o)!==JSON.stringify(cur.o)||n!==cur.n){COLL[id]={o,n};changed=true;}}
  for(const [id,f] of Object.entries(folders||{})){if(!f||typeof f.n!=='string')continue;const cur=FOLDERS[id];if(!cur){FOLDERS[id]={n:f.n,p:f.p||'',c:Array.isArray(f.c)?f.c:[],t:f.t||Date.now()};changed=true;continue;}const c=[...new Set([...cur.c,...(f.c||[])])];if(c.length!==cur.c.length){cur.c=c;changed=true;}}
  return changed;
}
async function cloudPull(){
  if(!SESSION)return;CLOUD='syncing';renderAcct();
  try{if(!await ensureFresh())throw new Error('session expired');
    const r=await fetch(SB_URL+'/rest/v1/collections?select=coll,folders,updated_at',{headers:sbHeaders()});
    if(r.status===401){setSession(null);CLOUD='off';renderAcct();toast('Signed out — sign in again');return;}
    if(!r.ok)throw new Error('pull '+r.status);
    const rows=await r.json();const row=rows[0];
    const changed=row?mergeInto(row.coll,row.folders):false;
    if(changed){LSset('omni.coll',COLL);LSset('omni.folders',FOLDERS);updateOwnPill();updateCollCount();if(VIEW==='coll')renderColl();else render();}
    CLOUD='ok';renderAcct();
    await cloudPush();
  }catch(e){CLOUD='error';renderAcct();}
}
let pushT=null,pushing=false,pushAgain=false;
function cloudPushSoon(){if(!SESSION)return;clearTimeout(pushT);pushT=setTimeout(cloudPush,1500);}
async function cloudPush(){
  if(!SESSION)return;if(pushing){pushAgain=true;return;}pushing=true;CLOUD='syncing';renderAcct();
  try{if(!await ensureFresh())throw new Error('session expired');
    const r=await fetch(SB_URL+'/rest/v1/collections',{method:'POST',headers:Object.assign(sbHeaders(),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({user_id:SESSION.user.id,coll:COLL,folders:FOLDERS,updated_at:new Date().toISOString()})});
    if(r.status===401){setSession(null);CLOUD='off';renderAcct();return;}
    if(!r.ok)throw new Error('push '+r.status);
    CLOUD='ok';}catch(e){CLOUD='error';}
  pushing=false;renderAcct();if(pushAgain){pushAgain=false;cloudPush();}
}
async function sendMagicLink(email){
  const redirect=location.origin+location.pathname;
  const r=await fetch(SB_URL+'/auth/v1/otp?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,create_user:true})});
  if(!r.ok){let m='';try{m=(await r.json()).msg||(await r.json()).error_description||'';}catch(e){}throw new Error(m||('Could not send ('+r.status+')'));}
}
async function signOut(){try{await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:sbHeaders()});}catch(e){}setSession(null);CLOUD='off';renderAcct();toast('Signed out — your collection stays in this browser');}
$('#acct').onclick=()=>{
  if(SESSION&&SESSION.user){openSheet(`<h3>${esc(SESSION.user.email||'Account')}</h3><p class="hint">${esc(syncText())}</p><div class="row"><button class="btn" id="so">Sign out</button><button class="btn pri" id="sync-now">Sync now</button></div>`);$('#so').onclick=()=>{closeSheet();signOut();};$('#sync-now').onclick=()=>{closeSheet();cloudPull();};return;}
  if(location.protocol==='file:'||/claude\.ai|claudeusercontent/.test(location.host)){openSheet(`<h3>Sign in</h3><p class="hint">Account sign-in works on the public site. Here, your collection already syncs to your Claude account.</p><div class="row"><button class="btn pri" id="ok1">OK</button></div>`);$('#ok1').onclick=closeSheet;return;}
  openSheet(`<h3>Sign in</h3><p class="hint">Enter your email and we'll send a one-tap sign-in link. No password. Your collection then follows you to every device.</p><input class="fld" id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"><div class="row"><button class="btn" id="em-cancel">Cancel</button><button class="btn pri" id="em-go">Send link</button></div><div class="saved" id="em-msg"></div>`);
  $('#em-cancel').onclick=closeSheet;const go=async()=>{const em=$('#em').value.trim();if(!em.includes('@')){$('#em-msg').textContent='Enter a valid email.';return;}$('#em-go').disabled=true;$('#em-msg').textContent='Sending…';try{await sendMagicLink(em);$('#em-msg').textContent='';sheet.querySelector('.hint').textContent='Check '+em+' for a link from Omnibinder (Supabase). Tap it on this device and you\'re in. The link expires in an hour.';$('#em-go').textContent='Done';$('#em-go').disabled=false;$('#em-go').onclick=closeSheet;$('#em-cancel').hidden=true;}catch(e){$('#em-go').disabled=false;$('#em-msg').textContent=e.message;}};
  $('#em-go').onclick=go;$('#em').addEventListener('keydown',e=>{if(e.key==='Enter')go();});$('#em').focus();
};

// ---------- collection view ----------
function setView(v){VIEW=v;$('#tab-binder').classList.toggle('on',v==='binder');$('#tab-coll').classList.toggle('on',v==='coll');
  $('#results').hidden=v!=='binder';$('#coll').hidden=v!=='coll';
  ['.search','#rail','#status'].forEach(s=>{const el=$(s);if(el)el.hidden=v!=='binder';});
  try{history.replaceState(null,'','#'+(v==='coll'?'collection':'binder'));}catch(e){}
  if(v==='coll')renderColl();}
function renderColl(){
  const R=$('#coll');const f=CUR&&FOLDERS[CUR]?FOLDERS[CUR]:null;if(CUR&&!f)CUR='';
  const path=pathOf(CUR);
  const crumbs=`<nav class="crumbs"><button data-go="">All folders</button>${path.map(id=>`<span class="sep">›</span><button data-go="${id}" class="${id===CUR?'cur':''}">${esc(FOLDERS[id].n)}</button>`).join('')}</nav>`;
  const tools=`<div class="ctools"><button class="tbtn" id="c-new">${ICON.plus}New folder</button>${f?`<button class="tbtn pri" id="c-add">${ICON.plus}Add cards</button><button class="tbtn" id="c-ren">Rename</button><button class="tbtn" id="c-del">Delete</button>`:''}</div>`;
  const ks=kids(CUR);
  const fold=ks.length?`<div class="folders">${ks.map(k=>`<button class="folder" data-open="${k}">${ICON.folder}<span style="min-width:0"><div class="fn">${esc(FOLDERS[k].n)}</div><div class="fc">${countDeep(k)} card${countDeep(k)===1?'':'s'}${kids(k).length?' · '+kids(k).length+' folder'+(kids(k).length===1?'':'s'):''}</div></span></button>`).join('')}</div>`:'';
  let cards='';
  if(f){const ps=f.c.map(k=>PK.get(k)).filter(p=>p!=null);
    cards=ps.length?`<p class="sec">${ps.length} card${ps.length===1?'':'s'} in this folder</p><div class="grid" style="--cols:${F.cols}">${ps.map(tile).join('')}</div>`:(ks.length?'':`<div class="cempty"><b>${esc(f.n)} is empty.</b><br>Tap <b>Add cards</b> to pick from the binder, or make a folder inside it.</div>`);}
  else if(!ks.length)cards=`<div class="cempty"><b>No folders yet.</b><br>Make one for a set you're chasing, a master set, or a trade binder. Folders can hold folders.</div>`;
  const sync=dbColl?'Synced to your Claude account and saved in this browser.':syncText();
  const backup=CUR?'':`<div class="savebar"><span id="savedat">${esc(sync)}</span><span class="flex"></span><button class="tbtn" id="bk-dl">Backup</button><button class="tbtn" id="bk-up">Restore</button><input type="file" id="bk-file" accept="application/json,.json" hidden></div>`;
  R.innerHTML=crumbs+tools+fold+cards+backup;
  if(!CUR){
    $('#bk-dl').onclick=()=>{const data={app:'omnibinder',v:1,exported:new Date().toISOString(),coll:COLL,folders:FOLDERS};const txt=JSON.stringify(data);
      const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(txt);a.download='omnibinder-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
      openSheet(`<h3>Backup</h3><p class="hint">A file named <b>${esc(a.download)}</b> should be downloading. If nothing happened (some viewers block downloads), copy the text instead and keep it somewhere safe.</p><textarea class="fld" id="bk-txt" style="min-height:90px;font-family:var(--font-num);font-size:11px" readonly>${esc(txt)}</textarea><div class="row"><button class="btn" id="bk-copy">Copy text</button><button class="btn pri" id="bk-ok">Done</button></div>`);
      $('#bk-ok').onclick=closeSheet;$('#bk-copy').onclick=()=>{navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>{$('#bk-txt').select();toast('Select all and copy');});};};
    $('#bk-up').onclick=()=>{openSheet(`<h3>Restore</h3><p class="hint">Pick a backup file, or paste its text. Restoring merges into what's here (nothing is deleted).</p><div class="row"><button class="btn" id="bk-pick">Choose file</button></div><textarea class="fld" id="bk-paste" style="min-height:90px;margin-top:10px;font-family:var(--font-num);font-size:11px" placeholder="…or paste backup text here"></textarea><div class="row"><button class="btn" id="bk-cancel">Cancel</button><button class="btn pri" id="bk-apply">Restore</button></div>`);
      $('#bk-cancel').onclick=closeSheet;$('#bk-pick').onclick=()=>$('#bk-file').click();
      $('#bk-file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{$('#bk-paste').value=x;toast('File loaded — tap Restore');});e.target.value='';};
      $('#bk-apply').onclick=()=>{let d;try{d=JSON.parse($('#bk-paste').value);}catch(e){toast('That is not a backup file');return;}if(!d||d.app!=='omnibinder'){toast('That is not an Omnibinder backup');return;}
        let n=0;for(const [id,e] of Object.entries(d.coll||{})){const ne=normEntry(Object.assign({sid:id},e));if(!ne)continue;const cur=COLL[id]||{o:{},n:''};const o=Object.assign({},cur.o,ne.o);const note=cur.n||ne.n;COLL[id]={o,n:note};n++;dbColl&&dbColl.doc(id).set({o,n:note}).catch(()=>{});}
        let nf=0;for(const [id,f] of Object.entries(d.folders||{})){if(!f||typeof f.n!=='string')continue;const cur=FOLDERS[id];const merged=cur?{n:cur.n,p:cur.p,c:[...new Set([...cur.c,...(f.c||[])])],t:cur.t}:{n:f.n,p:f.p||'',c:Array.isArray(f.c)?f.c:[],t:f.t||Date.now()};FOLDERS[id]=merged;dbFold&&dbFold.doc(id).set(merged).catch(()=>{});nf++;}
        saveLocal();saveFolders();updateOwnPill();updateCollCount();closeSheet();renderColl();cloudPushSoon();toast('Restored '+n+' cards, '+nf+' folders');};};
  }
  R.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{CUR=b.dataset.go;renderColl();});
  R.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{CUR=b.dataset.open;renderColl();});
  $('#c-new').onclick=()=>nameSheet('New folder',CUR?'Inside '+FOLDERS[CUR].n:'At the top level','',n=>{const id=newId();putFolder(id,{n,p:CUR,c:[],t:Date.now()});renderColl();});
  if(f){
    $('#c-add').onclick=()=>startPick(CUR);
    $('#c-ren').onclick=()=>nameSheet('Rename folder','',f.n,n=>{f.n=n;putFolder(CUR,f);renderColl();});
    $('#c-del').onclick=()=>{const n=countDeep(CUR),k=kids(CUR).length;openSheet(`<h3>Delete “${esc(f.n)}”?</h3><p class="hint">${n} card${n===1?'':'s'}${k?' and '+k+' subfolder'+(k===1?'':'s'):''} will be removed from your collection folders. Your owned ticks and notes stay.</p><div class="row"><button class="btn" id="dno">Keep it</button><button class="btn pri" id="dyes">Delete</button></div>`);$('#dno').onclick=closeSheet;$('#dyes').onclick=()=>{const p=f.p;dropFolder(CUR);CUR=p;closeSheet();renderColl();toast('Folder deleted');};};
  }
}
function nameSheet(title,hint,val,cb){openSheet(`<h3>${esc(title)}</h3>${hint?`<p class="hint">${esc(hint)}</p>`:''}<input class="fld" id="fname" value="${esc(val)}" placeholder="Folder name"><div class="row"><button class="btn" id="fcancel">Cancel</button><button class="btn pri" id="fok">Save</button></div>`);
  const inp=$('#fname');inp.focus();inp.select();const ok=()=>{const n=inp.value.trim();if(!n)return;closeSheet();cb(n);};$('#fok').onclick=ok;$('#fcancel').onclick=closeSheet;inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok();});}
function startPick(id){PICK=id;setView('binder');const bar=$('#pickbar');bar.hidden=false;bar.innerHTML=`<span>📂</span><span class="flex">Adding to <b>${esc(pathOf(id).map(x=>FOLDERS[x].n).join(' / '))}</b> — tap cards</span><button id="pickend">Done</button>`;$('#pickend').onclick=endPick;render();window.scrollTo({top:0});}
function endPick(){const id=PICK;PICK=null;$('#pickbar').hidden=true;CUR=id;setView('coll');}
$('#tab-binder').onclick=()=>{if(PICK)endPick();else setView('binder');};
$('#tab-coll').onclick=()=>{if(PICK)endPick();else setView('coll');};

// ---------- events ----------
let qt;$('#q').addEventListener('input',()=>{$('#qclear').hidden=!$('#q').value;PHOTO=null;clearTimeout(qt);qt=setTimeout(render,180);});
$('#qclear').onclick=()=>{$('#q').value='';$('#qclear').hidden=true;render();};
$('#rail').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)openFilter(b.dataset.k);});
$('#results').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;const p=+b.dataset.i;
  if(PICK&&FOLDERS[PICK]){const f=FOLDERS[PICK],pk=pkeyOf(p);const had=f.c.includes(pk);f.c=had?f.c.filter(x=>x!==pk):[...f.c,pk];putFolder(PICK,f);refreshTile(P_C[p]);toast((had?'Removed from ':'Added to ')+f.n+' · '+f.c.length);return;}
  openCard(p);});
$('#coll').addEventListener('click',e=>{const b=e.target.closest('.card');if(b)openCard(+b.dataset.i);});
document.addEventListener('click',e=>{
  if(e.target.id==='reset'){Object.assign(F,{state:'all',vars:[],type:[],reg:[],rar:[],notes:'all',cat:[],stage:[],set:[],ser:[],hpmin:'',hpmax:'',yearmin:'',yearmax:'',ill:[]});$('#q').value='';$('#qclear').hidden=true;PHOTO=null;persist();}
  if(e.target.id==='photoclear'){PHOTO=null;render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet();});
renderRail();render();if(location.hash==='#collection')setView('coll');document.getElementById('build').textContent=BUILD;
})();
</script>
